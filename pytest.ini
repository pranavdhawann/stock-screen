[pytest]
testpaths = tests
filterwarnings =
    error::DeprecationWarning:app.*
    # supabase-py internally passes deprecated timeout/verify params to its
    # bundled postgrest client (upstream issue, not our code).
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
