name: 💡 Feature Request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "As a swing trader, I want ... so that ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature. Screenshots or sketches of other tools welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sentiment / AI insights
        - News aggregation
        - SEC / BSE filings
        - Forecasting
        - Watchlists / accounts
        - Terminal UI
        - Deployment / infrastructure
        - Other
    validations:
      required: true
